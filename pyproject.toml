[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kfac-unlearn"
version = "0.1.0"
description = "Efficient machine unlearning via K-FAC Hessian approximation and two-tier paged storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Neil Sharma", email = "neilshar@uoregon.edu" }]
keywords = ["machine-unlearning", "influence-functions", "k-fac", "hessian", "pytorch"]

# Core engine runs on numpy + h5py alone. Everything else is an extra so a
# reviewer can `pip install -e .` and run the demo/tests with no torch or Redis.
dependencies = [
    "numpy>=1.24",
    "h5py>=3.9",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
torch = ["torch>=2.1", "torchvision>=0.16"]
nlp = ["transformers>=4.40", "datasets>=2.18", "scikit-learn>=1.3"]
experiments = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "datasets>=2.18",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "scikit-learn>=1.3",
    "torch>=2.1",
]
layer_scores = [
    "torch>=2.1",
    "torchvision>=0.16",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
]

[project.scripts]
kfac-demo = "scripts.run_demo:main"
kfac-train = "scripts.train:main"
kfac-unlearn = "scripts.unlearn:main"
kfac-benchmark = "scripts.benchmark:main"

[tool.setuptools.packages.find]
include = ["kfac_unlearn*", "caffeine*", "models*", "data*", "experiments*", "benchmarks*", "scripts*"]
exclude = ["influence-release*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
